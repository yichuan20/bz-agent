[project]
name = "workspace-backend"
version = "0.6.4"
description = "BoltzAgent workspace backend — a FastAPI service that manages bzcode agent sessions."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.124",
    "uvicorn[standard]>=0.33",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "python-multipart>=0.0.9",
    "python-docx>=1.2.0",
    "pypdf>=6.14.2",
    "openpyxl>=3.1.5",
    "python-pptx>=1.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workspace_backend"]

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
# Fail (not hang) if any test — e.g. an SSE stream that never terminates — runs long.
timeout = 30

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]
# Vendored bzcode helper scripts + templates are bzcode's tools, not our code.
extend-exclude = ["bzcode_assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: FastAPI's Depends()/Query() in argument defaults is the idiomatic pattern.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["workspace_backend"]
mypy_path = "src"
strict = true
